[alembic]
script_location = alembic

# Default DB URL (used only if DATABASE_URL env variable is not set)
sqlalchemy.url = postgresql+psycopg://rag:rag@db:5432/ragdb

# ---------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

# ---------------------------------------------------------
# Root logger
# ---------------------------------------------------------

[logger_root]
level = WARN
handlers = console
qualname =

# ---------------------------------------------------------
# SQLAlchemy logger
# ---------------------------------------------------------

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

# ---------------------------------------------------------
# Alembic logger
# ---------------------------------------------------------

[logger_alembic]
level = INFO
handlers =
qualname = alembic

# ---------------------------------------------------------
# Console handler
# ---------------------------------------------------------

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# ---------------------------------------------------------
# Formatter
# ---------------------------------------------------------

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
