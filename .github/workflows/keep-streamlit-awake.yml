name: Keep Agentic SQL RAG Awake

on:
    schedule:
        - cron: "0 */6 * * *"
    workflow_dispatch:

jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            - name: Ping Agentic SQL RAG
              run: |
                  curl -L --max-time 60 https://crb-agentic-sql-rag.streamlit.app || true
